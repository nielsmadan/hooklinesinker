name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ github.ref_name }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: nielsmadan/curtaincall@v1.2.0
      - name: Validate annotated tag and ancestry
        run: curtains ci validate-tag "$RELEASE_TAG" "$GITHUB_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check-all
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked

  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            packages: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: release-${{ matrix.target }}
      - if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/hooklinesinker
          if-no-files-found: error

  publish:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: nielsmadan/curtaincall@v1.2.0
      - name: Revalidate tag
        run: |
          RELEASE_COMMIT=$(curtains ci validate-tag "$RELEASE_TAG" "$GITHUB_SHA")
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8.0.2
        with:
          path: binaries
      - name: Assemble dist
        run: |
          set -euo pipefail
          mkdir dist
          lipo -create \
            binaries/binary-aarch64-apple-darwin/hooklinesinker \
            binaries/binary-x86_64-apple-darwin/hooklinesinker \
            -output dist/hooklinesinker-macos-universal
          cp binaries/binary-aarch64-unknown-linux-gnu/hooklinesinker dist/hooklinesinker-linux-aarch64
          cp binaries/binary-x86_64-unknown-linux-gnu/hooklinesinker dist/hooklinesinker-linux-x86_64
          chmod +x dist/*
          (cd dist && shasum -a 256 hooklinesinker-* > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Verify version matches tag
        run: |
          set -euo pipefail
          binary_version="$(./dist/hooklinesinker-macos-universal version --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          tag_version="${RELEASE_TAG#v}"
          if [ "$binary_version" != "$tag_version" ]; then
            echo "Cargo.toml version $binary_version does not match tag $tag_version" >&2
            exit 1
          fi
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/hooklinesinker-*
      - name: Write release notes
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          previous_tag="$(curtains ci previous-tag "$RELEASE_TAG")"
          if [ -n "$previous_tag" ]; then
            git log --no-merges --format='- %s' "$previous_tag..$RELEASE_TAG" > "$notes"
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$previous_tag" "$RELEASE_TAG" >> "$notes"
          else
            echo "Initial release." > "$notes"
          fi
          cat "$notes"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curtains ci publish "$RELEASE_TAG" "$RELEASE_COMMIT" \
            --notes "$RUNNER_TEMP/release-notes.md" \
            --title "hooklinesinker $RELEASE_TAG" \
            dist/*
