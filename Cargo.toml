[package]
name = "hooklinesinker"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hooklinesinker"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
assert_cmd = "2.2.2"
