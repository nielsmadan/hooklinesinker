[package]
name = "hooklinesinker"
version = "1.0.3"
edition = "2024"
autotests = false

[lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
redundant_pub_crate = "allow"

[lints.rust]
unreachable_pub = "warn"
unsafe_code = "forbid"

[lib]
name = "hooklinesinker"
path = "src/lib.rs"

[[bin]]
name = "hooklinesinker"
path = "src/main.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "examples"
path = "tests/examples.rs"

[[test]]
name = "ts_adapters"
path = "tests/ts_adapters.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
fs2 = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sysinfo = "0.38.4"
toml_edit = "0.25.13"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }

[dev-dependencies]
assert_cmd = "2.2.2"
