[package]
name = "hooklinesinker"
version = "1.0.2"
edition = "2024"

[lib]
name = "hooklinesinker"
path = "src/lib.rs"

[[bin]]
name = "hooklinesinker"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
fs2 = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sysinfo = "0.39.6"
toml_edit = "0.25.13"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }

[dev-dependencies]
assert_cmd = "2.2.2"
